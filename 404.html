<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | ElevateX Growth Partners</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/brand/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --charcoal: #100f0b; --cream: #ede6d6; --gold: #c8a86a; --gold-hover: #d8bd85; --muted: rgba(237, 230, 214, 0.6); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--charcoal); color: var(--cream); font-family: 'Jost', system-ui, sans-serif; padding: 2rem 1rem; text-align: center; }
  .eyebrow { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); }
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 300; font-size: clamp(32px, 6vw, 56px); margin: 1.25rem 0 1rem; }
  p { color: var(--muted); max-width: 40ch; margin: 0 auto 2.5rem; line-height: 1.6; }
  .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  a.btn { display: inline-block; padding: 1rem 2rem; border-radius: 2px; text-decoration: none; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; }
  a.primary { background: var(--gold); color: var(--charcoal); }
  a.primary:hover { background: var(--gold-hover); }
  a.ghost { border: 1px solid rgba(200, 168, 106, 0.4); color: var(--cream); }
</style>
</head>
<body>
  <main>
    <span class="eyebrow">Error 404</span>
    <h1>This page has moved on.</h1>
    <p>The link you followed no longer exists. Everything we do is one click from the homepage.</p>
    <div class="links">
      <a class="btn primary" href="/">Go to the homepage</a>
      <a class="btn ghost" href="/#menu">See our services</a>
    </div>
  </main>
</body>
</html>
